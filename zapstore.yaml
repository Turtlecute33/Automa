# Zapstore listing. The Zapstore indexer reads this file and publishes each new GitHub release.
repository: https://github.com/Turtlecute33/Automa
summary: AI coding agents on the phone. opencode, Claude Code and Codex in a local Linux system.
description: |
  Automa runs AI coding agents on the phone itself. It is not a remote control for a computer. The
  app has a small Alpine Linux system that runs with PRoot, and a terminal for the agents and a
  shell. Log in to GitHub, clone repositories, let an agent do fixes and analysis, then commit, push
  and make releases from the phone. Android 15 or newer, arm64. No trackers, no Google Play
  Services.

  - **Chat**: each agent has a chat made for touch. Each permission request, each question and each
    plan is a card with buttons. Commands and file changes show as cards with the output and the diff.
  - **Terminal**: the real terminal UI of each agent, with two rows of extra keys.
  - **Agents**: opencode uses the models of Tokens for Friends (TFF), an OpenAI-compatible gateway,
    with your own TFF API key. Claude Code and Codex are optional: install them in Settings (a
    download of about 100 MB each) and log in with your own account.
  - **GitHub**: the device flow of the GitHub CLI. Clone, push, pull requests and releases.
  - **Background**: sessions continue with the screen off, and a notification shows them.
  - **Files**: the home folder is in the system Files app. Share a selection or a full session.
  - **Security**: pinned SHA-256 digests for the setup, encrypted keys in the Android Keystore, no
    backup, app lock. A cloned repository cannot start programs before you trust it.
  - **Privacy**: Automa turns off the telemetry, share links and update checks of the agents. Your
    prompts and the code that an agent reads go to the model provider. All other parts run on the
    phone.

  On GrapheneOS, set "Native code debugging" to Allowed for Automa (PRoot uses ptrace), and keep
  "Restrict dynamic code loading" off.
